stages:
  data_ingestion:
    cmd: .venv/bin/python src/end_to_end_deep_learning_project_yt/pipeline/stage_01_data_ingestion.py
    deps:
      - src/end_to_end_deep_learning_project_yt/pipeline/stage_01_data_ingestion.py
      - config/config.yaml
    outs:
      - artifacts/data_ingestion/Chicken-fecal-images

  prepare_base_model:
    cmd: .venv/bin/python src/end_to_end_deep_learning_project_yt/pipeline/stage_02_prepare_base_model.py
    deps:
      - src/end_to_end_deep_learning_project_yt/pipeline/stage_02_prepare_base_model.py
      - config/config.yaml
    params:
      - IMAGE_SIZE
      - INCLUDE_TOP
      - CLASSES
      - WEIGHTS
      - LEARNING_RATE
    outs:
      - artifacts/prepare_base_model

  training:
    cmd: .venv/bin/python src/end_to_end_deep_learning_project_yt/pipeline/stage_03_training.py
    deps:
      - src/end_to_end_deep_learning_project_yt/pipeline/stage_03_training.py
      - config/config.yaml
      - src/end_to_end_deep_learning_project_yt/components/prepare_callbacks.py
      - artifacts/data_ingestion/Chicken-fecal-images
      - artifacts/prepare_base_model
    params:
      - IMAGE_SIZE
      - EPOCHS
      - BATCH_SIZE
      - AUGMENTATION
    outs:
      - artifacts/training/model.keras

  evaluation:
    cmd: .venv/bin/python src/end_to_end_deep_learning_project_yt/pipeline/stage_04_evaluation.py
    deps:
      - src/end_to_end_deep_learning_project_yt/pipeline/stage_04_evaluation.py
      - config/config.yaml
      - artifacts/data_ingestion/Chicken-fecal-images
      - artifacts/training/model.keras
    params:
      - IMAGE_SIZE
      - BATCH_SIZE
    metrics:
      - scores.json:
          cache: False
