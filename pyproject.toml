[project]
name = "end-to-end-deep-learning-project-yt"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Drake-Firestorm", email = "drakefirestorm@hotmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "dvc>=3.67.1",
    "ensure>=1.0.4",
    "fastapi>=0.162.0",
    "joblib>=1.6.0",
    "jupyterlab>=4.6.4",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "pandas>=3.1.0",
    "polars>=2.0.0",
    "python-box>=7.4.1",
    "pyyaml>=6.0.3",
    "scipy>=1.18.1",
    "seaborn>=0.13.2",
    "tensorflow[and-cuda]>=2.21.0",
    "tqdm>=4.70.1",
    "types-pyyaml>=6.0.12.20260906",
]

[project.scripts]
end-to-end-deep-learning-project-yt = "end_to_end_deep_learning_project_yt:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"
